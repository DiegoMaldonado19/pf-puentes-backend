# Entornos dev, stage y prod en la EC2. Los valores vienen del .env que escribe el pipeline.
name: puentes-${APP_ENV}-backend

# DT-DEP-09: los logs de contenedor rotan; las bitácoras JSON del backend van al volumen logs
x-registro: &registro
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgis/postgis:17-3.6-alpine
    restart: unless-stopped
    logging: *registro
    environment:
      POSTGRES_DB: puentes
      POSTGRES_USER: puentes_migrador
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "puentes_migrador", "-d", "puentes"]
      interval: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    logging: *registro
    # DT-DEP-11: el volumen (nuevo o heredado como root) queda con dueño 1000 y MinIO corre como 1000
    entrypoint:
      - sh
      - -c
      - '[ "$$(stat -c %u /data)" = 1000 ] || chown -R 1000:1000 /data; exec /usr/bin/docker-entrypoint.sh "$$@"'
      - "--"
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_USERNAME: minio
      MINIO_GROUPNAME: minio
      MINIO_UID: 1000
      MINIO_GID: 1000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME}/pf-puentes-backend:${IMAGE_TAG}
    restart: unless-stopped
    logging: *registro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/puentes
      DB_APP_USER: puentes_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATION_USER: puentes_migrador
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      MINIO_URL: http://minio:9000
      # Cuenta de servicio (scripts/minio-cuenta-servicio.sh); sin ella, cae a la cuenta root
      MINIO_APP_USER: ${MINIO_APP_USER:-${MINIO_ROOT_USER}}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:-${MINIO_ROOT_PASSWORD}}
      MINIO_URL_PUBLICA: ${MINIO_URL_PUBLICA}
      JWT_SECRET: ${JWT_SECRET}
      # El perfil prod exige sesión en /api/docs (DT-BE-12)
      SPRING_PROFILES_ACTIVE: ${APP_ENV}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Vacías en un entorno sin administrador: la app avisa en el log y sigue (RN-USR-03)
      ADMIN_INICIAL_CORREO: ${ADMIN_INICIAL_CORREO:-}
      ADMIN_INICIAL_NOMBRE: ${ADMIN_INICIAL_NOMBRE:-}
      ADMIN_INICIAL_CONTRASENA: ${ADMIN_INICIAL_CONTRASENA:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      # false solo en desarrollo local, sin HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # consola solo en desarrollo; con APP_ENV=prod la app exige smtp
      CORREO_MODO: ${CORREO_MODO:-consola}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-no-reply@puentes.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      LOGGING_FILE_NAME: /app/logs/sgp.log
    volumes:
      - logs:/app/logs

volumes:
  postgres-data:
  minio-data:
  logs:

# Compartida con el frontend del mismo entorno; la crea el pipeline
networks:
  default:
    name: puentes-${APP_ENV}
    external: true
