spring.application.name=pf-puentes-backend

# DT-BE-15: credenciales solo por variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_APP_USER}
spring.datasource.password=${DB_APP_PASSWORD}
# DT-BD-13: las migraciones usan otro usuario
spring.flyway.user=${DB_MIGRATION_USER}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.jpa.open-in-view=false
# Flyway crea el esquema; Hibernate solo comprueba al arrancar que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate

# DT-SEC-06: orígenes separados por coma; si falta la variable, ninguno
sgp.cors.origenes=${CORS_ALLOWED_ORIGINS:}

# DT-ALM-01
sgp.minio.url=${MINIO_URL}
sgp.minio.usuario=${MINIO_ROOT_USER}
sgp.minio.clave=${MINIO_ROOT_PASSWORD}
# DT-SEC-09: origen por el que el navegador alcanza las URL firmadas (ADR 0013)
sgp.minio.url-publica=${MINIO_URL_PUBLICA}

# RN-ARC-04: un PDF de hasta 20 MB; nginx corta en 25 MB (DT-DEP-03)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Detrás de nginx: IP real del cliente y https desde X-Forwarded-*
server.forward-headers-strategy=native

# DT-BE-12: bajo /api/, que es lo único que nginx reenvía
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/docs/swagger-ui.html
# Cada operación documenta sus propios códigos de respuesta
springdoc.override-with-generic-response=false

# DT-DEP-10: actuator en un puerto que no se publica
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics

# DT-SEC-01, DT-BE-15: clave de firma HS256 (mínimo 32 bytes); sin ella la app no arranca
sgp.jwt.secreto=${JWT_SECRET:}
# DT-SEC-01: token de acceso de 15 minutos y de renovación de 7 días
sgp.jwt.vigencia-acceso=PT15M
sgp.jwt.vigencia-renovacion=P7D
# RN-USR-07: 5 intentos fallidos en una ventana de 15 minutos bloquean la cuenta 15 minutos
sgp.login.intentos-maximos=5
sgp.login.ventana=PT15M
sgp.login.bloqueo=PT15M
# DT-SEC-02: la cookie de renovación es Secure salvo en desarrollo local (http://localhost)
sgp.renovacion.cookie-segura=${COOKIE_SECURE:true}
# RN-USR-03, DT-BE-15: primer administrador; solo se crea si no existe ninguno. Vacías: no se crea
sgp.administrador-inicial.correo=${ADMIN_INICIAL_CORREO:}
sgp.administrador-inicial.nombre=${ADMIN_INICIAL_NOMBRE:}
sgp.administrador-inicial.contrasena=${ADMIN_INICIAL_CONTRASENA:}
# Rutas públicas (RN-USR-10), separadas por coma: "/ruta/**" o "GET /ruta/**". Todo lo demás es privado
sgp.seguridad.rutas-publicas=POST /api/v1/auth/login,POST /api/v1/auth/renovar,POST /api/v1/auth/cerrar-sesion,POST /api/v1/auth/registro,POST /api/v1/auth/verificar-correo,POST /api/v1/auth/reenviar-verificacion,POST /api/v1/auth/invitaciones/consultar,POST /api/v1/auth/invitaciones/aceptar,POST /api/v1/auth/recuperar-contrasena,POST /api/v1/auth/restablecer-contrasena
# La cuenta la emite el JWT, no el usuario "user" con contraseña aleatoria que crea Spring Boot
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Dirección del frontend: base de los enlaces de los correos
sgp.frontend.url=${FRONTEND_URL:http://localhost:4200}
# RN-USR-01: vigencia del enlace de verificación del correo
sgp.verificacion-correo.vigencia=PT24H
# RN-USR-03: vigencia del enlace de invitación
sgp.invitacion.vigencia=P7D
# DT-SEC-07: vigencia del enlace de recuperación de contraseña
sgp.recuperacion-contrasena.vigencia=PT1H
# consola (solo desarrollo: imprime el enlace en el log; prohibido con el perfil prod) | smtp
sgp.correo.modo=${CORREO_MODO:consola}
sgp.correo.remitente=${CORREO_REMITENTE:no-reply@puentes.local}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Una caída del SMTP no debe dejar la app "unhealthy" (DT-DEP-10): el envío falla solo y se reintenta
management.health.mail.enabled=false
