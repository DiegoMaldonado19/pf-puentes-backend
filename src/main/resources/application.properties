spring.application.name=pf-puentes-backend

# DT-BE-15: credenciales solo por variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_APP_USER}
spring.datasource.password=${DB_APP_PASSWORD}
# DT-BD-13: las migraciones usan otro usuario
spring.flyway.user=${DB_MIGRATION_USER}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.jpa.open-in-view=false

# DT-DEP-10: actuator en un puerto que no se publica
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics
