spring.application.name=pf-puentes-backend

# DT-BE-15: credenciales solo por variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_APP_USER}
spring.datasource.password=${DB_APP_PASSWORD}
# DT-BD-13: las migraciones usan otro usuario
spring.flyway.user=${DB_MIGRATION_USER}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.jpa.open-in-view=false
# Flyway crea el esquema; Hibernate solo comprueba al arrancar que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate

# DT-SEC-06: orígenes separados por coma; si falta la variable, ninguno
sgp.cors.origenes=${CORS_ALLOWED_ORIGINS:}

# DT-ALM-01
sgp.minio.url=${MINIO_URL}
sgp.minio.usuario=${MINIO_ROOT_USER}
sgp.minio.clave=${MINIO_ROOT_PASSWORD}
# DT-SEC-09: origen por el que el navegador alcanza las URL firmadas (ADR 0013)
sgp.minio.url-publica=${MINIO_URL_PUBLICA}

# RN-ARC-04: un PDF de hasta 20 MB; nginx corta en 25 MB (DT-DEP-03)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Detrás de nginx: IP real del cliente y https desde X-Forwarded-*
server.forward-headers-strategy=native

# DT-BE-12: bajo /api/, que es lo único que nginx reenvía
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/docs/swagger-ui.html
# Cada operación documenta sus propios códigos de respuesta
springdoc.override-with-generic-response=false

# DT-DEP-10: actuator en un puerto que no se publica
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics
